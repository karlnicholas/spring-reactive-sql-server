spring.application.name=spring-reactive-sql-server

# Application traffic is R2DBC. Host, port, and database are all required by
# org.mssqllib.r2dbc.mssql. trustServerCertificate skips the local cert check.
spring.r2dbc.url=r2dbc:mssql://demoreactiveuser:demoreactivepassword@localhost:1433/demoreactive?trustServerCertificate=true
# Open sockets on first use, and keep the demo pool small.
spring.r2dbc.pool.initial-size=0
spring.r2dbc.pool.max-size=4

# Schema changes are Flyway's job, over JDBC, before the application serves traffic.
# Setting spring.flyway.url makes Flyway build its own DataSource. The app does
# not also configure spring.datasource.*, so request handling stays on R2DBC.
spring.flyway.url=jdbc:sqlserver://localhost:1433;databaseName=demoreactive;encrypt=true;trustServerCertificate=true
spring.flyway.user=demoreactiveuser
spring.flyway.password=demoreactivepassword
